name: Build AURA Diagnostics APK
on:
  push:
    branches:
      - aura-diagnostics-android-build
    paths:
      - "aura-diagnostics/**"
      - ".github/workflows/aura-android.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source archive
        shell: bash
        run: |
          mkdir -p aura-diagnostics/project
          cat aura-diagnostics/src-0{0,1,2,3,4}.txt | base64 -d > /tmp/aura-src.tar.xz
          echo "e575b6581de696cab3b5841abeaf3f21212bfa2c9baed31ccc30ceaf7c599da9  /tmp/aura-src.tar.xz" | sha256sum -c -
          tar -xJf /tmp/aura-src.tar.xz -C aura-diagnostics/project
      - name: Apply Android installer compatibility settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('aura-diagnostics/project/app/build.gradle')
          s=p.read_text()
          for old,new in [
              ("targetSdk 35","targetSdk 34"),
              ("versionCode 1","versionCode 2"),
              ("versionName '0.1.0'","versionName '0.2.0'"),
              ("buildTypes { release { minifyEnabled false } }","signingConfigs { debug { v1SigningEnabled true; v2SigningEnabled true } }\n          buildTypes { release { minifyEnabled false } }"),
          ]:
              assert old in s, f"Missing expected build config: {old}"
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Add TXT export and native Android file sharing
        run: python3 aura-diagnostics/patch/upgrade.py
      - name: Apply AURA v0.4 firmware-readiness checks
        shell: bash
        run: |
          base64 -d aura-diagnostics/patch/aura-v04-overlay.tar.gz.b64 > /tmp/aura-v04-overlay.tar.gz
          echo "d12d97f4b73f46fd13851f59c743aed30a7187f92b6f4f1454dd470f8535e2bd  /tmp/aura-v04-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/aura-v04-overlay.tar.gz -C aura-diagnostics/project
      - name: Strengthen serial redaction and mark 0.4.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("aura-diagnostics/project")
          runner = base / "app/src/main/java/com/auratv/diagnostics/DiagnosticRunner.java"
          s = runner.read_text()
          old = "android_id|serial_number"
          assert old in s
          s = s.replace(old, r"androidboot\\.serialno|android_id|serial_number")
          s = s.replace('"tool_version", "0.4.0"', '"tool_version", "0.4.1"')
          runner.write_text(s)
          gradle = base / "app/build.gradle"
          g = gradle.read_text()
          assert "versionCode 4" in g
          g = g.replace("versionCode 4", "versionCode 5").replace("versionName '0.4.0'", "versionName '0.4.1'")
          gradle.write_text(g)
          PY
      - name: Add 15 alternative read-only Deep Scan checks
        run: python3 aura-diagnostics/patch/upgrade_v05.py
      - name: Add guarded full eMMC backup capability v0.6
        run: python3 aura-diagnostics/patch/upgrade_v06.py
      - name: Add AURA Firmware Investigator v0.7
        run: python3 aura-diagnostics/patch/upgrade_v07.py
      - name: Add targeted firmware puzzle v0.8
        run: python3 aura-diagnostics/patch/upgrade_v08.py
      - name: Add on-phone file export v0.9
        run: python3 aura-diagnostics/patch/upgrade_v09.py
      - name: Fix delayed ADB packets in raw file transfer
        run: python3 aura-diagnostics/patch/upgrade_v10.py
      - name: Verify exported ZIP size and share provider v1.1
        run: python3 aura-diagnostics/patch/upgrade_v11.py
      - name: Add optimized code capture v1.2
        run: python3 aura-diagnostics/patch/upgrade_v12.py
      - name: Collect read-only OTA local evidence v1.3
        run: python3 aura-diagnostics/patch/upgrade_v13.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Simulate stale ADB packets and verify byte-exact transfers
        run: python3 aura-diagnostics/tests/stream_protocol_test.py
      - name: Compile Android APK
        run: gradle --no-daemon -p aura-diagnostics/project assembleDebug
      - name: Verify APK signatures and manifest
        shell: bash
        run: |
          APK=aura-diagnostics/project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-OTA-Evidence-v1.3
          path: aura-diagnostics/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
